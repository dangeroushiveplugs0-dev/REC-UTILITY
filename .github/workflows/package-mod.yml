name: Package REC Utility for GUMMM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate mod files and cheat catalogue
        run: python3 scripts/validate_mod.py

      - name: Build importable ZIP
        run: |
          mkdir -p dist
          cd mod
          zip -qr ../dist/REC-UTILITY.zip .

      - name: Verify ZIP layout
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath

          archive = "dist/REC-UTILITY.zip"
          with ZipFile(archive) as z:
              names = set(z.namelist())
              required = {"mod.cfg", "mod.gd", "data/cheats.json"}
              missing = required - names
              if missing:
                  raise SystemExit(f"ZIP is missing root-level mod files: {sorted(missing)}")
              if any(PurePosixPath(name).is_absolute() or ".." in PurePosixPath(name).parts for name in names):
                  raise SystemExit("ZIP contains an unsafe path.")
          print(f"Verified {archive}")
          PY

      - name: Upload GUMMM mod ZIP
        uses: actions/upload-artifact@v4
        with:
          name: REC-UTILITY-GUMMM-ZIP
          path: dist/REC-UTILITY.zip
          if-no-files-found: error
          retention-days: 30
